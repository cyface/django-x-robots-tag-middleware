[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "django-x-robots-tag-middleware"
version = "2.0.0"
description = "Enables returning the X-Robots-Tag header for all URLs. Useful during development to ensure sites are not accidentally indexed before they are ready."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim White", email = "tim@cyface.com" }]
requires-python = ">=3.10"
keywords = ["django", "middleware", "x-robots-tag", "seo", "noindex", "robots"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = ["Django>=5.2"]

[project.urls]
Homepage = "https://github.com/cyface/django-x-robots-tag-middleware"
Repository = "https://github.com/cyface/django-x-robots-tag-middleware"
Issues = "https://github.com/cyface/django-x-robots-tag-middleware/issues"
Changelog = "https://github.com/cyface/django-x-robots-tag-middleware/releases"

[dependency-groups]
# coverage needs the [toml] extra to read its config from pyproject.toml on
# Python 3.10, where tomllib is not yet in the standard library.
dev = ["coverage[toml]>=7.16.0", "ruff>=0.9"]

[tool.uv.build-backend]
# Flat layout: the package sits at the repository root, not under src/.
module-root = ""
module-name = "x_robots_tag_middleware"
# Ship the demo project in the sdist so the test suite is runnable from it.
source-include = ["manage.py", "x_robots_tag_middleware_demo/**"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"x_robots_tag_middleware_demo/settings.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
branch = true
source = ["x_robots_tag_middleware"]
omit = [
    "*/__init__.py",
    "*/apps.py",
    "*/migrations/*",
    "*/tests*",
]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
