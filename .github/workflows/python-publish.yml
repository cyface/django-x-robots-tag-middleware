# Builds the package and publishes it to PyPI using Trusted Publishing (OIDC).
#
# One-time setup: add a Trusted Publisher for this repository/workflow at
# https://pypi.org/manage/project/django-x-robots-tag-middleware/settings/publishing/
# Once configured, no PyPI username/password/API-token secrets are needed.
name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Cache intentionally left at the default (`auto`), which disables it
          # for `release` events to guard against cache poisoning.
          python-version: "3.13"
      - name: Build sdist and wheel
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-x-robots-tag-middleware
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
