# Lints and tests the package against the supported Python and Django versions.
name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        # --locked fails the build if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked --group dev
      - name: Ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: Ruff format
        run: uv run --no-sync ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.0+ requires Python 3.12 or newer.
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"

    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Sync the locked dev tools, then pin the Django version under test.
        run: |
          uv sync --locked --group dev
          uv pip install "Django~=${{ matrix.django-version }}.0"
      - name: Run Django system checks
        run: uv run --no-sync python manage.py check
      - name: Test
        run: |
          uv run --no-sync coverage run manage.py test
          uv run --no-sync coverage xml
          uv run --no-sync coverage report
      - name: Upload coverage to Codecov
        # Dependabot and fork pull requests cannot read the repository's Actions
        # secrets, so CODECOV_TOKEN is empty there and the upload fails hard
        # under fail_ci_if_error. Skip the upload for those; the tests above
        # still gate the PR.
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true
