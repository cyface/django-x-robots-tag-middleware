version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    # This is a library: keep the permissive bounds in pyproject.toml and let
    # Dependabot update only uv.lock, which is dev/CI-only and never published.
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
